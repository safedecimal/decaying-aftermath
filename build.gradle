plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = providers.fileContents(layout.projectDirectory.file('VERSION')).asText.get().trim()
group = 'io.github.safedecimal.decayingaftermath'

base {
    archivesName = 'decaying-aftermath'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Reproducible CU presentation and packaged-resource checks, without launching either game.
tasks.register('verifyMedicalPresentation', Test) {
    description = 'Verify CU asset bindings, pulse selection, native ECG and presentation timing.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.MedicalPresentationPolicyTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.MedicalPresentationTimelineTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.ConsciousnessLayoutTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.EcgTraceTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.medical.CuAssetBindingTest'
    }
}

processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

tasks.register('verifyMedicalProcedures', Test) {
    description = 'Verify CU status icons, resource percentages, continuous wrapping and inertial hand mechanics.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.BandageWrapMotionTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.CuHandMotionTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.CuProcedureGeometryTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.MedicalStatusIconsTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.MedicalUiRenderingTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.ProcedureCursorTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.ProcedureToolPoseTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.SupplyOverlayLayoutTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.FastenerMotionTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.medical.MedicalSupplyPolicyTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.medical.MedicalSupplyNbtTest'
    }
}

tasks.register('verifyMedicalUiRendering', Test) {
    description = 'Verify native 26.3 scissor transforms, visible block-arm bounds and full status sprite regions.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.MedicalUiRenderingTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.ProcedureCursorTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.ProcedureToolPoseTest'
    }
}

tasks.register('verifyMedicalVitals', Test) {
    description = 'Verify restorative LastStand, layered care, energy/consciousness, infection and optional mod bridges.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.medical.BodyVitalsTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.medical.MedicalSupplyConsolidationTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.medical.NativeItemComponentPrototypeTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.medical.MedicalStackPrototypeTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.MedicalVitalsAssetBindingTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.MedicalVitalsReadoutTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.client.MedicalDeathMusicStateTest'
        includeTestsMatching 'io.github.safedecimal.decayingaftermath.compat.*'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

jar {
    from('LICENSE') {
        rename { "${it}_decaying-aftermath" }
    }
}
