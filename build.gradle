plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = providers.fileContents(layout.projectDirectory.file('VERSION')).asText.get().trim()
group = 'io.github.safedecimal.decayingaftermath'

base {
    archivesName = 'decaying-aftermath'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

jar {
    from('LICENSE') {
        rename { "${it}_decaying-aftermath" }
    }
}
